<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Missões da Capi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="/assets/img/ico/diamante.ico">
</head>

<body>

    <section id="tela-inicio">
        <h1>Missões da Capi</h1>
        <div class="cartao"><button class="botao botao-verde" id="botao-jogar">Jogar</button></div>
    </section>

    <section id="tela-cadastro" hidden>
        <h1>Missões da Capi</h1>
        <div class="cartao">
            <input id="campo-nome" placeholder="Nome">
            <input id="campo-idade" type="number" inputmode="numeric" placeholder="Idade">
            <input id="campo-escola" placeholder="Escola">
            <button class="botao botao-verde" id="botao-comecar">Começar</button>
        </div>
    </section>

    <section class="tela-missao" id="tela-missao-1" data-missao="1" hidden>
        <h1 class="titulo-missao">Missão 1</h1>
        <div class="capi-e-fala-missao">
            <img class="capi-missao" src="assets/img/capi/feliz.webp" alt="" draggable="false">
            <div class="balao-fala grande">
                <p class="fala-missao">Oi<span class="nome-crianca"></span>! Eu sou a Capi! Vamos começar a Missão 1? Eu
                    vou te ajudar!</p>
                <button class="botao-som-balao ouvir-missao"><img class="desenho" src="assets/emoji/1f50a.svg" alt=""
                        draggable="false"></button>
            </div>
        </div>
        <button class="botao botao-verde botao-vamos">Vamos!</button>
    </section>

    <main id="g" class="c" hidden>
        <div id="hd"></div>
        <div class="cb"><img id="cp" alt="">
            <div class="bub s">
                <p id="pt"></p><button class="ico" id="rp"></button>
            </div>
        </div>
        <div id="st"></div>
    </main>
    <div id="ov" hidden></div>
    <script src="js/questoes.js"></script>
    <script src="js/jogo.js"></script>
</body>

</html>
